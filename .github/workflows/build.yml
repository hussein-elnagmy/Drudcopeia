name: build-native
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          ls -- *Drugcopoeia-r178.zip.part* | sort -t. -k3 | xargs cat > /tmp/src.zip
          echo '42f0fd6e7c22fd86e14ee157bf149b9e49a641fd1b5b3800eedf4bc2b0e3bf90  /tmp/src.zip' | sha256sum -c -
          unzip -q /tmp/src.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        working-directory: Source
        run: npm ci --no-audit --no-fund
      - name: Build debug APK
        working-directory: Source/android
        run: |
          rm -f local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Note on AI runtime
        run: |
          echo 'APK built without libllamaserver.so (absent from r177 source): the assistant answers via grounded smart search; no on-device model runtime.' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: Dawaya-android-apk
          path: Source/android/app/build/outputs/apk/**/*.apk

  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          ls -- *Drugcopoeia-r178.zip.part* | sort -t. -k3 | xargs cat > /tmp/src.zip
          echo '42f0fd6e7c22fd86e14ee157bf149b9e49a641fd1b5b3800eedf4bc2b0e3bf90  /tmp/src.zip' | sha256sum -c -
          unzip -q /tmp/src.zip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Fetch llama.cpp b11985 Windows runtime (official release, hash-checked)
        run: |
          mkdir -p /tmp/llama-runtime
          curl -fL -o /tmp/llama-runtime/win.zip https://github.com/ggml-org/llama.cpp/releases/download/b11985/llama-b11985-bin-win-cpu-x64.zip
          echo '1c93f23afd48f8434c4cdc4d9f0a46f47a0d98ea6b3214007cbddc10c34c0c16  /tmp/llama-runtime/win.zip' | sha256sum -c -
      - name: Cross-compile Windows exe
        working-directory: Source/windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          LLAMA_WIN_ZIP: /tmp/llama-runtime/win.zip
        run: ./build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dawaya-windows-exe
          path: Source/windows/dist/*.exe

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          ls -- *Drugcopoeia-r178.zip.part* | sort -t. -k3 | xargs cat > /tmp/src.zip
          echo '42f0fd6e7c22fd86e14ee157bf149b9e49a641fd1b5b3800eedf4bc2b0e3bf90  /tmp/src.zip' | shasum -a 256 -c -
          unzip -q /tmp/src.zip
      - name: Build ad-hoc signed DMG
        working-directory: Source/macos
        run: ./build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dawaya-macos-dmg
          path: Source/build/Dawaya-mac.dmg

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack source archive
        run: |
          ls -- *Drugcopoeia-r178.zip.part* | sort -t. -k3 | xargs cat > /tmp/src.zip
          echo '42f0fd6e7c22fd86e14ee157bf149b9e49a641fd1b5b3800eedf4bc2b0e3bf90  /tmp/src.zip' | shasum -a 256 -c -
          unzip -q /tmp/src.zip
      - name: Build iOS app (unsigned, simulator)
        working-directory: Source/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData build
      - name: Package simulator app
        working-directory: Source/ios/App
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name '*.app' -maxdepth 3 | head -1)
          echo "Built app: $APP_PATH" >> $GITHUB_STEP_SUMMARY
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Dawaya-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dawaya-ios-simulator-unsigned
          path: Source/ios/App/Dawaya-ios-simulator.zip
